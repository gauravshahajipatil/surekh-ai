services:
  surekh-ai:
    build: .
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      PORT: 4000
      FRONTEND_URL: http://localhost:4000
      DATABASE_PATH: /data/surekh.db
      UPLOAD_DIR: /data/uploads
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the environment or .env}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:?Set INITIAL_ADMIN_EMAIL in the environment or .env}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD in the environment or .env}
    volumes:
      - surekh_data:/data

volumes:
  surekh_data:
